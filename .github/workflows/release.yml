name: Release Ular Tangga Modern

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package playable ZIP
        run: zip -r Ular-Tangga-Modern-${{ github.ref_name }}.zip index.html manifest.json sw.js Play-Game.bat README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Ular Tangga Modern ${{ github.ref_name }}"
          generate_release_notes: true
          files: Ular-Tangga-Modern-${{ github.ref_name }}.zip
